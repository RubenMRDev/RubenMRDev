<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rubén Martín Ruiz">
  <circle cx="32" cy="32" r="32" fill="#fff"/>
  <!-- Butt caps and miter joins keep the arm ends cut flat and the tips sharp,
       which is what makes the mark read as a glyph rather than as three
       rounded strokes once it is scaled down to a 16px tab icon. -->
  <g fill="none" stroke="#1a1d24" stroke-width="3.6" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M25 23 12 32l13 9"/>
    <path d="M36.2 18.5 27 42.5"/>
    <path d="M39 23l13 9-13 9"/>
  </g>
</svg>
